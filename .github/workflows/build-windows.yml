name: Build Windows Installer

# This is the actual build/verification path for the desktop app. Tauri
# desktop builds must run on the target OS (or a matching CI runner) because
# the bundler shells out to native, OS-specific tooling (NSIS/WiX on
# Windows, linker + WebView2 headers, etc.) that only exists there. A plain
# Linux dev container — like the one this scaffold was authored in — cannot
# cross-compile a working Windows .exe/.msi.
#
# Trigger manually from the Actions tab ("Run workflow"), or push a tag like
# `v1.0.0` to also attach the installer to a GitHub Release automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer (NSIS .exe + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only attach to a GitHub Release when this run was triggered by a
          # version tag push; a manual dispatch just uploads build artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Miniature Painter {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
